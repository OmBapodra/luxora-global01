<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luxora Global - Admin Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding: 20px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      color: #1a1a1a;
      font-size: 24px;
    }
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #1a1a1a;
      color: white;
    }
    .btn-primary:hover {
      background: #333;
    }
    .btn-danger {
      background: #d32f2f;
      color: white;
    }
    .btn-danger:hover {
      background: #b71c1c;
    }
    .btn-delete {
      background: #d32f2f;
      color: white;
      padding: 5px 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn-delete:hover {
      background: #b71c1c;
    }
    .btn-confirm {
      background: #2e7d32;
      color: white;
      padding: 5px 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn-confirm:hover {
      background: #1b5e20;
    }
    .actions {
      white-space: nowrap;
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .btn-delete-all {
      background: #b71c1c;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn-delete-all:hover {
      background: #8b0000;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .stat-card h3 {
      color: #666;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .stat-card .value {
      font-size: 32px;
      font-weight: bold;
      color: #1a1a1a;
    }
    .table-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 15px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }
    th {
      background: #f9f9f9;
      font-weight: 600;
      color: #333;
    }
    tr:hover {
      background: #f5f5f5;
    }
    .status {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }
    .status-new {
      background: #e3f2fd;
      color: #1976d2;
    }
    .status-read {
      background: #e8f5e9;
      color: #388e3c;
    }
    .status-completed {
      background: #e8f5e9;
      color: #2e7d32;
    }
    .status-completed::before {
      content: '\2713\00a0';
      font-weight: bold;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #666;
    }
    .empty-state h2 {
      margin-bottom: 10px;
      color: #333;
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
    }
    .login-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 80vh;
    }
    .login-box {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    .login-box h2 {
      text-align: center;
      margin-bottom: 30px;
      color: #1a1a1a;
    }
    .login-logo {
      display: block;
      margin: 0 auto 20px;
      max-width: 180px;
      height: auto;
      background: white;
      padding: 10px;
      border-radius: 12px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 500;
      color: #333;
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      outline: none;
      border-color: #1a1a1a;
    }
    .password-wrapper {
      position: relative;
    }
    .password-wrapper input {
      padding-right: 45px;
    }
    .toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #666;
      font-size: 14px;
      padding: 5px;
    }
    .toggle-password:hover {
      color: #333;
    }
    .remember-row {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }
    .remember-row input[type="checkbox"] {
      width: auto;
      margin-right: 8px;
      cursor: pointer;
    }
    .remember-row label {
      margin-bottom: 0;
      cursor: pointer;
      font-size: 14px;
      color: #555;
    }
    .login-box .btn {
      width: 100%;
      padding: 12px;
      font-size: 16px;
    }
    .error-msg {
      color: #d32f2f;
      text-align: center;
      margin-bottom: 15px;
      font-size: 14px;
      display: none;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-box {
      background: white;
      border-radius: 12px;
      padding: 30px;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      text-align: center;
    }
    .modal-box h3 {
      font-size: 18px;
      color: #1a1a1a;
      margin-bottom: 10px;
    }
    .modal-box p {
      font-size: 14px;
      color: #666;
      margin-bottom: 25px;
    }
    .modal-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    .modal-buttons .btn {
      min-width: 100px;
    }
    .btn-cancel {
      background: #f0f0f0;
      color: #333;
    }
    .btn-cancel:hover {
      background: #e0e0e0;
    }
    .btn-confirm-modal {
      background: #2e7d32;
      color: white;
    }
    .btn-confirm-modal:hover {
      background: #1b5e20;
    }
    .search-bar {
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .search-bar input {
      flex: 1;
      max-width: 400px;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.2s;
    }
    .search-bar input:focus {
      outline: none;
      border-color: #1a1a1a;
    }
    .search-bar .search-count {
      font-size: 13px;
      color: #888;
    }
    .detail-card {
      background: white;
      border-radius: 12px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      text-align: left;
    }
    .detail-card h3 {
      font-size: 20px;
      color: #1a1a1a;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #eee;
    }
    .detail-row {
      display: flex;
      margin-bottom: 12px;
      font-size: 14px;
    }
    .detail-label {
      font-weight: 600;
      color: #555;
      min-width: 120px;
      flex-shrink: 0;
    }
    .detail-value {
      color: #1a1a1a;
      word-break: break-word;
    }
    .detail-buttons {
      display: flex;
      gap: 10px;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #eee;
      justify-content: flex-end;
    }
    .btn-gmail {
      background: #d44638;
      color: white;
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-gmail:hover {
      background: #b33a2d;
    }
    .btn-whatsapp {
      background: #25d366;
      color: white;
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-whatsapp:hover {
      background: #1ebe57;
    }
    .row-clickable {
      cursor: pointer;
    }
    .row-clickable:hover {
      background: #e8f0fe;
    }

    /* Hamburger Menu */
    .hamburger {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      z-index: 1001;
    }
    .hamburger svg {
      width: 24px;
      height: 24px;
      stroke: #1a1a1a;
    }
    .mobile-menu {
      display: none;
      position: fixed;
      top: 0;
      right: -280px;
      width: 280px;
      height: 100vh;
      background: white;
      box-shadow: -4px 0 20px rgba(0,0,0,0.15);
      z-index: 1000;
      padding: 80px 20px 20px;
      transition: right 0.3s ease;
    }
    .mobile-menu.active {
      right: 0;
    }
    .mobile-menu-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 999;
    }
    .mobile-menu-overlay.active {
      display: block;
    }
    .mobile-menu .menu-item {
      display: block;
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 8px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 500;
      text-align: left;
      transition: all 0.2s;
    }
    .mobile-menu .menu-item-delete {
      background: #d32f2f;
      color: white;
    }
    .mobile-menu .menu-item-delete:hover {
      background: #b71c1c;
    }
    .mobile-menu .menu-item-primary {
      background: #1a1a1a;
      color: white;
    }
    .mobile-menu .menu-item-primary:hover {
      background: #333;
    }
    .mobile-menu .menu-item-danger {
      background: #d32f2f;
      color: white;
    }
    .mobile-menu .menu-item-danger:hover {
      background: #b71c1c;
    }
    .close-menu {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
    }
    .close-menu svg {
      width: 24px;
      height: 24px;
      stroke: #666;
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      body {
        padding: 12px;
      }
      header {
        flex-wrap: wrap;
        padding: 16px;
        gap: 12px;
      }
      header h1 {
        font-size: 16px;
      }
      .desktop-actions {
        display: none !important;
      }
      .hamburger {
        display: block;
      }
      .mobile-menu {
        display: block;
      }
      .stats {
        grid-template-columns: 1fr;
        gap: 12px;
      }
      .stat-card {
        padding: 16px;
      }
      .stat-card .value {
        font-size: 24px;
      }
      .search-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .search-bar input {
        max-width: 100%;
      }
      .search-bar .search-count {
        text-align: center;
      }
      .table-container {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
      table {
        min-width: 900px;
      }
      th, td {
        padding: 10px 12px;
        font-size: 13px;
      }
      .detail-card {
        padding: 20px;
        max-width: 95%;
      }
      .detail-row {
        flex-direction: column;
        gap: 4px;
      }
      .detail-label {
        min-width: auto;
      }
      .detail-buttons {
        flex-wrap: wrap;
      }
      .modal-box {
        padding: 20px;
        max-width: 95%;
      }
      .modal-buttons {
        flex-direction: column;
      }
      .modal-buttons .btn {
        width: 100%;
      }
    }

    @media (max-width: 480px) {
      header {
        padding: 12px;
      }
      header h1 {
        font-size: 14px;
      }
      .login-box {
        padding: 24px;
        margin: 0 12px;
      }
      .login-box h2 {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <!-- Login Form -->
  <div id="loginSection" class="login-wrapper" style="display: none;">
    <div class="login-box">
      <img src="/logo.png" alt="Luxora Global" class="login-logo" />
      <h2>Admin Login</h2>
      <div class="error-msg" id="loginError">Invalid username or password</div>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter username" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="Enter password" />
          <button type="button" class="toggle-password" onclick="togglePassword()" id="toggleBtn">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>
      <div class="remember-row">
        <input type="checkbox" id="rememberMe" />
        <label for="rememberMe">Remember me</label>
      </div>
      <button class="btn btn-primary" onclick="login()">Login</button>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboardSection" class="container" style="display: none;">
    <header>
      <div style="display:flex;align-items:center;gap:12px;">
        <img src="/logo.png" alt="Luxora Global" style="height:45px;width:auto;" />
        <h1>Luxora Global - Inquiries</h1>
      </div>
      <div class="desktop-actions" style="display:flex;gap:8px;align-items:center;">
        <button class="btn-delete-all" onclick="deleteAllInquiries()">Delete All</button>
        <button class="btn btn-primary" onclick="exportExcel()">Download Excel</button>
        <button class="btn btn-primary" onclick="loadInquiries()">Refresh</button>
        <button class="btn btn-danger" onclick="logout()">Logout</button>
      </div>
      <button class="hamburger" onclick="toggleMobileMenu()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </header>

    <!-- Mobile Menu Overlay -->
    <div class="mobile-menu-overlay" id="mobileOverlay" onclick="toggleMobileMenu()"></div>

    <!-- Mobile Menu -->
    <div class="mobile-menu" id="mobileMenu">
      <button class="close-menu" onclick="toggleMobileMenu()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <button class="menu-item menu-item-delete" onclick="deleteAllInquiries(); toggleMobileMenu();">Delete All</button>
      <button class="menu-item menu-item-primary" onclick="exportExcel(); toggleMobileMenu();">Download Excel</button>
      <button class="menu-item menu-item-primary" onclick="loadInquiries(); toggleMobileMenu();">Refresh</button>
      <button class="menu-item menu-item-danger" onclick="logout(); toggleMobileMenu();">Logout</button>
    </div>

    <div class="stats">
      <div class="stat-card">
        <h3>Total Inquiries</h3>
        <div class="value" id="totalInquiries">0</div>
      </div>
      <div class="stat-card">
        <h3>New Inquiries</h3>
        <div class="value" id="newInquiries">0</div>
      </div>
      <div class="stat-card">
        <h3>Today's Inquiries</h3>
        <div class="value" id="todayInquiries">0</div>
      </div>
    </div>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search by name, phone, or product..." oninput="filterInquiries()" />
      <span class="search-count" id="searchCount"></span>
    </div>

    <div class="table-container">
      <div id="content">
        <div class="loading">Loading inquiries...</div>
      </div>
    </div>
  </div>

  <!-- Confirm Modal -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal-box">
      <h3 id="modalTitle">Are you sure?</h3>
      <p id="modalMessage">This action cannot be undone.</p>
      <div class="modal-buttons">
        <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn btn-danger" id="modalConfirmBtn" onclick="confirmAction()">Delete</button>
      </div>
    </div>
  </div>

  <!-- Inquiry Detail Modal -->
  <div class="modal-overlay" id="detailModal" onclick="if(event.target===this)closeDetailModal()">
    <div class="detail-card">
      <h3 id="detailTitle">Inquiry Details</h3>
      <div id="detailBody"></div>
      <div class="detail-buttons">
        <button class="btn btn-cancel" onclick="closeDetailModal()">Cancel</button>
        <a id="detailGmail" class="btn-gmail" href="#" target="_blank">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          Gmail
        </a>
        <a id="detailWhatsapp" class="btn-whatsapp" href="#" target="_blank">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
          WhatsApp
        </a>
      </div>
    </div>
  </div>

  <script>
    let inquiries = [];
    let pendingConfirmAction = null;

    function toggleMobileMenu() {
      document.getElementById('mobileMenu').classList.toggle('active');
      document.getElementById('mobileOverlay').classList.toggle('active');
    }

    function showModal(title, message, onConfirm, confirmText, confirmClass) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalMessage').textContent = message;
      pendingConfirmAction = onConfirm;
      const btn = document.getElementById('modalConfirmBtn');
      btn.textContent = confirmText || 'Delete';
      btn.className = 'btn ' + (confirmClass || 'btn-danger');
      document.getElementById('confirmModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('confirmModal').classList.remove('active');
      pendingConfirmAction = null;
    }

    function confirmAction() {
      if (pendingConfirmAction) {
        pendingConfirmAction();
      }
      closeModal();
    }

    document.getElementById('confirmModal').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });

    function openDetailModal(id) {
      const inquiry = inquiries.find(i => i.id === id);
      if (!inquiry) return;

      document.getElementById('detailTitle').textContent = 'Inquiry from ' + inquiry.fullName;

      const fields = [
        { label: 'Full Name', value: inquiry.fullName },
        { label: 'Company', value: inquiry.companyName || '-' },
        { label: 'Email', value: inquiry.email },
        { label: 'Phone', value: inquiry.phone || '-' },
        { label: 'Category', value: inquiry.category },
        { label: 'Product', value: inquiry.product },
        { label: 'Quantity', value: inquiry.quantity || '-' },
        { label: 'Message', value: inquiry.message },
        { label: 'Date', value: new Date(inquiry.date).toLocaleString() },
        { label: 'Status', value: inquiry.status }
      ];

      let html = '';
      fields.forEach(f => {
        html += `<div class="detail-row"><span class="detail-label">${f.label}</span><span class="detail-value">${f.value}</span></div>`;
      });
      document.getElementById('detailBody').innerHTML = html;

      const email = encodeURIComponent(inquiry.email);
      const subject = encodeURIComponent('Re: Your inquiry about ' + inquiry.product);
      const body = encodeURIComponent('Hi ' + inquiry.fullName + ',\n\nThank you for your inquiry about ' + inquiry.product + '.\n\n');
      document.getElementById('detailGmail').href = `https://mail.google.com/mail/?view=cm&fs=1&to=${email}&su=${subject}&body=${body}`;

      const phone = (inquiry.phone || '').replace(/[^0-9]/g, '');
      const waMessage = encodeURIComponent('Hi ' + inquiry.fullName + ', thank you for your inquiry about ' + inquiry.product + '.');
      document.getElementById('detailWhatsapp').href = phone ? `https://wa.me/${phone}?text=${waMessage}` : '#';

      document.getElementById('detailModal').classList.add('active');
    }

    function closeDetailModal() {
      document.getElementById('detailModal').classList.remove('active');
    }

    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const toggleBtn = document.getElementById('toggleBtn');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        </svg>`;
      } else {
        passwordInput.type = 'password';
        toggleBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>`;
      }
    }

    function getToken() {
      return localStorage.getItem('adminToken') || sessionStorage.getItem('adminToken');
    }

    function saveToken(token, remember) {
      if (remember) {
        localStorage.setItem('adminToken', token);
      } else {
        sessionStorage.setItem('adminToken', token);
      }
    }

    function removeToken() {
      localStorage.removeItem('adminToken');
      sessionStorage.removeItem('adminToken');
    }

    function authHeaders() {
      return { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' };
    }

    async function login() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const remember = document.getElementById('rememberMe').checked;
      const errorEl = document.getElementById('loginError');
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        if (res.ok) {
          const data = await res.json();
          saveToken(data.token, remember);
          showDashboard();
        } else {
          const data = await res.json().catch(() => ({}));
          errorEl.textContent = data.error || 'Invalid username or password';
          errorEl.style.display = 'block';
        }
      } catch (e) {
        errorEl.textContent = 'Invalid username or password';
        errorEl.style.display = 'block';
      }
    }

    async function logout() {
      const token = getToken();
      if (token) {
        await fetch('/api/logout', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } });
      }
      removeToken();
      showLogin();
    }

    function showLogin() {
      document.getElementById('loginSection').style.display = 'flex';
      document.getElementById('dashboardSection').style.display = 'none';
    }

    function showDashboard() {
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('dashboardSection').style.display = 'block';
      loadInquiries();
    }

    async function loadInquiries() {
      try {
        const response = await fetch('/api/inquiries', { headers: authHeaders() });
        if (response.status === 401) { showLogin(); return; }
        inquiries = await response.json();
        updateStats();
        renderTable();
      } catch (error) {
        console.error('Error loading inquiries:', error);
        document.getElementById('content').innerHTML = '<div class="empty-state"><h2>Error loading inquiries</h2><p>Please try again later.</p></div>';
      }
    }

    function updateStats() {
      document.getElementById('totalInquiries').textContent = inquiries.length;
      document.getElementById('newInquiries').textContent = inquiries.filter(i => i.status === 'New').length;
      
      const today = new Date().toDateString();
      document.getElementById('todayInquiries').textContent = inquiries.filter(i => new Date(i.date).toDateString() === today).length;
    }

    function filterInquiries() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = inquiries.filter(i =>
        (i.fullName || '').toLowerCase().includes(query) ||
        (i.phone || '').toLowerCase().includes(query) ||
        (i.product || '').toLowerCase().includes(query)
      );
      document.getElementById('searchCount').textContent = query ? `${filtered.length} result${filtered.length !== 1 ? 's' : ''}` : '';
      renderTable(filtered);
    }

    function renderTable(data) {
      const list = data || inquiries;
      if (list.length === 0) {
        const msg = document.getElementById('searchInput').value.trim()
          ? '<div class="empty-state"><h2>No results found</h2><p>Try a different search term.</p></div>'
          : '<div class="empty-state"><h2>No inquiries yet</h2><p>Inquiries from the contact form will appear here.</p></div>';
        document.getElementById('content').innerHTML = msg;
        return;
      }

      const sortedInquiries = [...list].reverse();
      
      let html = '<table>';
      html += '<thead><tr>';
      html += '<th>Date</th>';
      html += '<th>Name</th>';
      html += '<th>Company</th>';
      html += '<th>Email</th>';
      html += '<th>Phone</th>';
      html += '<th>Category</th>';
      html += '<th>Product</th>';
      html += '<th>Quantity</th>';
      html += '<th>Message</th>';
      html += '<th>Status</th>';
      html += '<th>Action</th>';
      html += '</tr></thead>';
      html += '<tbody>';
      
      sortedInquiries.forEach(inquiry => {
        const date = new Date(inquiry.date).toLocaleString();
        html += `<tr class="row-clickable" onclick="openDetailModal(${inquiry.id})" style="cursor:pointer">`;
        html += `<td>${date}</td>`;
        html += `<td>${inquiry.fullName}</td>`;
        html += `<td>${inquiry.companyName || '-'}</td>`;
        html += `<td>${inquiry.email}</td>`;
        html += `<td>${inquiry.phone || '-'}</td>`;
        html += `<td>${inquiry.category}</td>`;
        html += `<td>${inquiry.product}</td>`;
        html += `<td>${inquiry.quantity || '-'}</td>`;
        html += `<td>${inquiry.message}</td>`;
        html += `<td><span class="status status-${inquiry.status.toLowerCase()}">${inquiry.status === 'Completed' ? 'Completed' : inquiry.status}</span></td>`;
        html += `<td class="actions" onclick="event.stopPropagation()">
          ${inquiry.status !== 'Completed' ? `<button class="btn-confirm" onclick="confirmInquiry(${inquiry.id})">Confirm</button>` : ''}
          <button class="btn-delete" onclick="deleteInquiry(${inquiry.id})">Delete</button>
        </td>`;
        html += '</tr>';
      });
      
      html += '</tbody></table>';
      document.getElementById('content').innerHTML = html;
    }

    function exportExcel() {
      const token = getToken();
      window.location.href = '/api/inquiries/export?token=' + encodeURIComponent(token);
    }

    async function deleteInquiry(id) {
      showModal('Delete Inquiry', 'Are you sure you want to delete this inquiry?', async () => {
        try {
          const response = await fetch(`/api/inquiries/${id}`, {
            method: 'DELETE',
            headers: authHeaders()
          });
          if (response.ok) {
            loadInquiries();
          }
        } catch (error) {
          console.error('Error deleting inquiry:', error);
        }
      }, 'Delete', 'btn-danger');
    }

    async function deleteAllInquiries() {
      showModal('Delete All Inquiries', 'Are you sure you want to delete ALL inquiries? This cannot be undone.', async () => {
        try {
          const response = await fetch('/api/inquiries', {
            method: 'DELETE',
            headers: authHeaders()
          });
          if (response.ok) {
            loadInquiries();
          }
        } catch (error) {
          console.error('Error deleting all inquiries:', error);
        }
      }, 'Delete', 'btn-danger');
    }

    async function confirmInquiry(id) {
      showModal('Confirm Inquiry', 'Mark this inquiry as completed?', async () => {
        try {
          const response = await fetch(`/api/inquiries/${id}`, {
            method: 'PATCH',
            headers: authHeaders(),
            body: JSON.stringify({ status: 'Completed' })
          });
          if (response.ok) {
            loadInquiries();
          }
        } catch (error) {
          console.error('Error confirming inquiry:', error);
        }
      }, 'Confirm', 'btn-confirm-modal');
    }

    // On page load, check if already logged in
    if (getToken()) {
      showDashboard();
    } else {
      showLogin();
    }

    // Auto-refresh inquiries every second
    let refreshInterval = null;
    function startAutoRefresh() {
      if (refreshInterval) clearInterval(refreshInterval);
      refreshInterval = setInterval(() => {
        if (document.getElementById('dashboardSection').style.display !== 'none') {
          loadInquiries();
        }
      }, 1000);
    }
    function stopAutoRefresh() {
      if (refreshInterval) clearInterval(refreshInterval);
      refreshInterval = null;
    }

    // Override showDashboard and showLogin to manage auto-refresh
    const originalShowDashboard = showDashboard;
    showDashboard = function() {
      originalShowDashboard();
      startAutoRefresh();
    };

    const originalShowLogin = showLogin;
    showLogin = function() {
      stopAutoRefresh();
      originalShowLogin();
    };

    const originalLogout = logout;
    logout = async function() {
      stopAutoRefresh();
      await originalLogout();
    };
  </script>
</body>
</html>
